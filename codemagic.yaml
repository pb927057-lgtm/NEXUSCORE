
workflows:
  vel-android-debug:
    name: VEL 0.1 - Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check Android project
        script: |
          echo "Checking VEL Android project..."
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
