pasos :
  - nombre : Descargar código fuente del repositorio
    usos : actions/checkout@v4

  - nombre : Configurar JDK 17 (Temurin)
    usos : actions/setup-java@v4
    con :
      distribución : ' temurin '
      versión de java : ' 17 '

  - nombre : Localizar directorio raíz del proyecto Android
    id : find-android
    correr : |
      echo "=== DIAGNÓSTICO DE ESTRUCTURA DEL REPOSITORIO ==="
      persona con discapacidad
      ls-la
      Si [ -f "gradlew" ] && [ -d "app" ]; entonces
        DIRECTORIO_DESTINATARIO="."
      elif [ -f "android-vel/gradlew" ] && [ -d "android-vel/app" ]; then
        TARGET_DIR="android-vel"
      elif [ -f "vel-android-nativo/gradlew" ] && [ -d "vel-android-nativo/app" ]; entonces
        TARGET_DIR="vel-android-nativo"
      demás
        DESCUBRIDO=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)
        si [ -n "$DISCOVERED" ]; entonces
          TARGET_DIR=$(dirname "$DISCOVERED")
        demás
          DIRECTORIO_DESTINATARIO="."
        fi
      fi
      echo "Directorio de compilación: '$TARGET_DIR'"
      echo "ANDROID_DIR=$TARGET_DIR" >> $GITHUB_ENV
      echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
  - nombre : Verificar y asegurar wrapper de Gradle (propiedades y jar)
    correr : |
      WRAPPER_DIR="${{ env.ANDROID_DIR }}/gradle/wrapper"
      mkdir -p "$WRAPPER_DIR"
      PROPS_PATH="$WRAPPER_DIR/gradle-wrapper.properties"
      if [ ! -f "$PROPS_PATH" ]; then
        echo "AVISO: gradle-wrapper.properties no encontrado en $PROPS_PATH. Generando automáticamente..."
        cat << 'EOF' > "$PROPS_PATH"
