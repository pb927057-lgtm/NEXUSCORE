name: Build Android APK - VEL 0.1

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test VEL Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Locate and validate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "gradlew" && -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            ANDROID_DIR="."
          elif [[ -f "android-vel/gradlew" && -f "android-vel/settings.gradle.kts" && -f "android-vel/app/build.gradle.kts" ]]; then
            ANDROID_DIR="android-vel"
          elif [[ -f "vel-android-nativo/gradlew" && -f "vel-android-nativo/settings.gradle.kts" && -f "vel-android-nativo/app/build.gradle.kts" ]]; then
            ANDROID_DIR="vel-android-nativo"
          else
            echo "ERROR: No se encontró la raíz completa del proyecto Android."
            echo "Se necesitan gradlew, settings.gradle.kts y app/build.gradle.kts."
            find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle.kts" -o -name "build.gradle.kts" \) -print
            exit 1
          fi

          echo "Proyecto Android encontrado en: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle Wrapper
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew || { echo "ERROR: falta gradlew"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "ERROR: falta gradle-wrapper.properties"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "ERROR: falta gradle-wrapper.jar"; exit 1; }

          JAR_SIZE=$(wc -c < gradle/wrapper/gradle-wrapper.jar)
          echo "Tamaño del Gradle Wrapper JAR: $JAR_SIZE bytes"

          if [ "$JAR_SIZE" -lt 1000 ]; then
            echo "ERROR: gradle-wrapper.jar parece incompleto."
            exit 1
          fi

          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ steps.android.outputs.android_dir }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.android_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: no se generó un APK válido."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vel-0.1-app-debug
          path: ${{ steps.android.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
