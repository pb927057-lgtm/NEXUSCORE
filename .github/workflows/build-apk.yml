
name: Build Android APK - VEL 0.1

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test VEL Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "gradlew" && -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            ANDROID_DIR="."
          elif [[ -f "android-vel/gradlew" && -f "android-vel/settings.gradle.kts" && -f "android-vel/app/build.gradle.kts" ]]; then
            ANDROID_DIR="android-vel"
          elif [[ -f "vel-android-nativo/gradlew" && -f "vel-android-nativo/settings.gradle.kts" && -f "vel-android-nativo/app/build.gradle.kts" ]]; then
            ANDROID_DIR="vel-android-nativo"
          else
            echo "ERROR: Complete Android project not found."
            echo "Required: gradlew, settings.gradle.kts and app/build.gradle.kts."
            find . -maxdepth 5 -type f \( \
              -name "gradlew" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle.kts" \
            \) -print
            exit 1
          fi

          echo "Android project directory: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found: $SDK"
            exit 1
          fi

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager was not found."
            find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Gradle Wrapper
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew || {
            echo "ERROR: gradlew is missing."
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.jar || {
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          }

          JAR_SIZE=$(wc -c < gradle/wrapper/gradle-wrapper.jar)

          echo "Gradle Wrapper JAR size: $JAR_SIZE bytes"

          if [ "$JAR_SIZE" -lt 1000 ]; then
            echo "ERROR: Gradle Wrapper JAR appears incomplete."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Run Android unit tests
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build VEL Debug APK
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated or is empty."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload VEL APK
        uses: actions/upload-artifact@v4
        with:
          name: VEL-0.1-Android-APK
          path: ${{ steps.android.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
